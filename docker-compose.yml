version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      SHCA_ENV: development
      SHCA_API_HOST: 0.0.0.0
      SHCA_API_PORT: 8000
      SHCA_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/self_healing
      SHCA_REDIS_URL: redis://redis:6379/0
      SHCA_GITHUB_APP_ID: local-dev
      SHCA_GITHUB_WEBHOOK_SECRET: local-secret
      SHCA_RUN_DB_MIGRATIONS_ON_STARTUP: "true"
      SHCA_ARTIFACT_STORAGE_PATH: /data/artifacts
      SHCA_VALIDATION_CHECKOUT_ROOT: /data/validation_repos
    volumes:
      - shca-data:/data
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      SHCA_ENV: development
      SHCA_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/self_healing
      SHCA_REDIS_URL: redis://redis:6379/0
      SHCA_GITHUB_APP_ID: local-dev
      SHCA_GITHUB_WEBHOOK_SECRET: local-secret
      SHCA_ARTIFACT_STORAGE_PATH: /data/artifacts
      SHCA_VALIDATION_CHECKOUT_ROOT: /data/validation_repos
    command:
      [
        "python",
        "-c",
        "from self_healing_agent.worker import run_worker_loop; run_worker_loop()",
      ]
    volumes:
      - shca-data:/data
    depends_on:
      - api
      - postgres
      - redis

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8000
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: self_healing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
  shca-data:
